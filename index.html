<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Linktree</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #121212);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #bdbdbd;
            margin-bottom: 30px;
        }

        .link {
            display: block;
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            transition: 0.3s;
            font-weight: bold;
        }

        .link:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.2);
        }

        .footer {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://via.placeholder.com/120" alt="Foto de Perfil" class="profile-pic">

    <h1>Yellowzin</h1>
    <p>Criador de conteúdo • Skate 3 • Curiosidades</p>

    <a href="https://youtube.com" class="link" target="_blank">
        🎥 YouTube
    </a>

    <a href="https://instagram.com" class="link" target="_blank">
        📸 Instagram
    </a>

    <a href="https://discord.gg" class="link" target="_blank">
        💬 Discord
    </a>

    <a href="https://github.com" class="link" target="_blank">
        💻 GitHub
    </a>

    <div class="footer">
        © 2026 Yellowzin
    </div>
</div>

</body>
</html>
